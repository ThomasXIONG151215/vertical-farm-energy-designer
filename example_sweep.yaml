# 参数扫描示例 — 用法：vfed sweep example_sweep.yaml --out results.csv
# 顶层不设 pv_area_m2/battery_kwh，装机由下方 parameter_ranges 的 pv_area/battery 枚举决定
name: example_sweep
# 站点与气象（Open-Meteo 按 lat/lon/year 拉取，可缓存）
site:
  lat: 30.9
  lon: 121.5
  tz_hours: 8.0
  tilt: 20.0
  azimuth: 180.0
  year: 2023
# 建筑围护结构（第一性原理 ODE 热工模型）
envelope:
  U_wall_A: 125.3
  A_window: 0.0
  eta_solar: 0.15
  ach: 0.5
  permeance: 0.0
  V_room: 200.0
  rho_air: 1.2
  cp_air: 1005.0
  C_z: 200000.0
# 空调系统（cop_mode: constant 恒 COP；可选 carnot/constant/linear/table）
hvac:
  P_rated_w: 3000.0
  cop_value: 4.0
  cop_mode: constant
  cop_k: 0.02
  cop_T_ref: 25.0
  cop_heat: 3.0
  heat_mode: heat_pump
  P_rated_heat_w: 3000.0
  deadband_c: 1.0
  min_on_s: 180.0
  min_off_s: 180.0
  fan_power_w: 70.0
  shr_BF: 0.15
  tau_q: 90.0
  tau_m: 60.0
# 除湿机（P_ref_w 额定功率；poly_e 为功率多项式系数）
deh:
  P_ref_w: 2233.0
  poly_e:
  - 1.0
  - 0.02
  - 0.0
  - 0.05
  - 0.0
  - 0.0
  T_mean: 22.0
  T_std: 5.0
  W_mean: 0.012
  W_std: 0.003
  smer: 2.0
  deadband_rh: 3.0
  min_on_s: 180.0
  min_off_s: 180.0
  fan_power_w: 40.0
  tau_q: 90.0
  tau_m: 120.0
# LED 照明（auto_deduce=true 时按 ppfd_target×covered_area/efficacy 重算功率）
led:
  power_w: 1300.0  # 被 auto_deduce 覆盖：实际重算为 ppfd_target×covered_area/efficacy≈7200W
  light_start_hour: 6
  photoperiod_hours: 16
  heat_fraction: 1.0
  auto_deduce: true  # true → power_w 忽略，功率=ppfd_target×covered_area/efficacy
  efficacy: 2.5
  ppfd_target: 400.0
  covered_area: 45.0
# 蒸腾模型（method: van_henten 生长耦合；也可用 daily / per_plant / daily_per_period / per_plant_per_period）
transpiration:
  method: van_henten
  stage_factor: 1.0
# 温湿度/CO2 设定点（光期/暗期分设温度）
setpoints:
  T_light: 22.0
  T_dark: 18.0
  RH: 65.0
  co2_ppm: 800.0
  crop_cycle_days: 30.0
# 光伏组件参数（STC 铭牌；alpha_sc/beta_voc 为相对温漂系数 /K）
pv:
  eta_pv: 0.233
  area_to_power: 4.3
  N_s: 156
  I_sc_stc: 13.98
  V_oc_stc: 57.34
  I_mp_stc: 12.66
  V_mp_stc: 45.85
  alpha_sc: 0.00045
  beta_voc: -0.0025
  NOCT: 45.0
  eta_inv: 0.97
  C_pv: 110.0
  degradation: 0.004
# 电池系统（c_energy 单位成本 元/kWh；cycle_life 全循环寿命）
battery:
  c_energy: 220.0
  c_rate: 1.0
  eta_ch: 0.91
  eta_dis: 0.91
  soc_min: 0.1
  soc_max: 0.9
  cycle_life: 4000
# 电价（legacy 三费率：peak/normal/valley + 峰谷小时列表；新项目推荐 hourly_prices）
# 注意：本示例为平 0.096，与上海参考价（峰 1.00/出口 0.4155）不一致，仅作格式示例。
# 可用 `vfed design new ... --tariff Shanghai` 载入参考电价。
tariff:
  peak_price: 0.096
  normal_price: 0.096
  valley_price: 0.096
  export_price: 0.05
  peak_hours:
  - 10
  - 11
  - 12
  - 13
  - 14
  - 18
  - 19
  - 20
  - 21
  valley_hours:
  - 0
  - 1
  - 2
  - 3
  - 4
  - 5
  - 23
# 设计空间：objective=lcoe 目标；parameter_ranges 供 vfed sweep 枚举（[min, max, step]）
# 已缩至 3 参数（4×5×5=100 组，约 1-2 分钟）；key 名见 vfed/design/sweep.py 注册表
space:
  parameter_ranges:
    ppfd_target:  # 光强（µmol/m²·s）— 建筑侧最大能耗驱动参数
    - 150
    - 300
    - 50
    pv_area:  # 光伏面积（m²）— 与电池联合寻优 LCOE 最优装机
    - 0
    - 200
    - 50
    battery:  # 电池容量（kWh）
    - 0
    - 100
    - 25
  timestep_s: 600.0
equipment_power_w: 0.0  # 其他设备恒定基础电耗（W）
