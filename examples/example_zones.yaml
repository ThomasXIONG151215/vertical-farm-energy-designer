# 多分区示例 — zones: 覆盖补丁（override-delta）契约
# 用途：一个项目 YAML 描述多个房间（区）。每个区只写与全局不同的字段；
#       未写的 section / 字段自动继承全局值（字段级合并 view = {**全局, **补丁}）。
# 校验：vfed validate examples/example_zones.yaml
# 运行：vfed evaluate examples/example_zones.yaml --cache weather_cache
#       （非空 zones 会为每个区各跑一次全年仿真，报告按区聚合）
# 文档：docs/architecture.md · 契约见 vfed/design/project.py（ZONE_OVERRIDABLE）
name: example_zones
# 站点与气象（与 examples/example_sweep.yaml 相同；weather_cache/ 已缓存该格点）
site:
  lat: 30.9
  lon: 121.5
  tz_hours: 8.0
  tilt: 20.0
  azimuth: 180.0
  year: 2023
# 建筑围护结构（第一性原理 ODE 热工模型；全局基准，各区继承）
envelope:
  U_wall_A: 125.3
  A_window: 0.0
  eta_solar: 0.15
  ach: 0.001   # 密闭植物工厂气密换气率（Kozai 2013: 0.01-0.02；0.1 为保守泄漏上限）
  permeance: 0.0
  V_room: 200.0
  rho_air: 1.2
  cp_air: 1005.0
  C_z: 200000.0
# 空调系统（全局基准，各区继承；grow 区仅覆盖 deadband_c 一个字段）
hvac:
  P_rated_w: 3000.0
  cop_value: 4.0
  cop_mode: constant
  cop_k: 0.02
  cop_T_ref: 25.0
  cop_heat: 3.0
  heat_mode: heat_pump
  P_rated_heat_w: 3000.0
  deadband_c: 1.0
  min_on_s: 180.0
  min_off_s: 180.0
  fan_power_w: 70.0
  shr_BF: 0.15
  tau_q: 90.0
  tau_m: 60.0
# 除湿机（全局基准，各区继承）
deh:
  P_ref_w: 2233.0
  poly_e:
  - 1.0
  - 0.02
  - 0.0
  - 0.05
  - 0.0
  - 0.0
  T_mean: 22.0
  T_std: 5.0
  W_mean: 0.012
  W_std: 0.003
  smer: 2.0
  deadband_rh: 3.0
  min_on_s: 180.0
  min_off_s: 180.0
  fan_power_w: 40.0
  tau_q: 90.0
  tau_m: 120.0
# LED 照明（全局基准；nursery 区仅覆盖 ppfd_target）
led:
  power_w: 1300.0  # 被 auto_deduce 覆盖：实际重算为 ppfd_target×covered_area/efficacy
  light_start_hour: 6
  photoperiod_hours: 16
  heat_fraction: 1.0
  auto_deduce: true  # true → power_w 忽略，功率=ppfd_target×covered_area/efficacy
  efficacy: 2.5
  ppfd_target: 400.0
  covered_area: 45.0
# 蒸腾模型（全局基准，各区继承）
transpiration:
  method: van_henten
  stage_factor: 1.0
# 温湿度/CO2 设定点（全局基准；nursery 区仅覆盖 T_light 与 RH）
setpoints:
  T_light: 22.0
  T_dark: 18.0
  RH: 65.0
  co2_ppm: 800.0
  crop_cycle_days: 30.0
# 电价（legacy 三费率；可用 hourly_prices 替代）
tariff:
  peak_price: 0.096
  normal_price: 0.096
  valley_price: 0.096
  export_price: 0.05
  peak_hours:
  - 10
  - 11
  - 12
  - 13
  - 14
  - 18
  - 19
  - 20
  - 21
  valley_hours:
  - 0
  - 1
  - 2
  - 3
  - 4
  - 5
  - 23
# 设计空间（zones 在 v1 不可扫描；此处仅保留时间步与缺省目标）
space:
  parameter_ranges: {}
  timestep_s: 600.0
  objective: lcoe
equipment_power_w: 0.0  # 其他设备恒定基础电耗（W）
# ── 多分区（multi-room v1）───────────────────────────────────────────────
# zones: 区 id → 覆盖补丁。合法 section 白名单（ZONE_OVERRIDABLE）：
#   setpoints / led / hvac / deh / co2 / transpiration / growth / envelope
# 未写的 section 自动继承全局；写出的 section 内未列字段也继承全局。
# tariff / pv / battery / space / 经济参数是项目级共享配置，不可按区覆盖。
# 区 id 规则：字母或 '_' 开头，后接字母/数字/'_'/'-'；不得使用保留字
#   total / building / all（整厂聚合标签专用）。
zones:
  # 育苗区：更凉、更湿、光强更低（幼苗偏好）
  nursery:
    setpoints:
      T_light: 20.0   # 全局 22.0 → 育苗期光期温度低 2 °C
      RH: 70.0        # 全局 65.0 → 更高湿度
    led:
      ppfd_target: 250.0   # 全局 400 → 幼苗 PPFD 需求较低
  # 成品区：仅收紧 HVAC 恒温死区（其余全部继承全局，含 deh/led/setpoints）
  grow:
    hvac:
      deadband_c: 0.5   # 全局 1.0 → 更紧的温度控制带
