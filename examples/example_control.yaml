# 控制节拍示例 — control: 段（ControlConfig，唯一字段 period_s）
# 用途：声明楼宇控制策略的决策节拍。策略本身在 Python 侧挂载——通过
#       vfed/design/control.py 的 build_policy({"type": ..., "params": ...})
#       工厂构造（内置注册策略见 POLICY_REGISTRY，如 "setpoint_offset"）；
#       YAML 只声明节拍，不携带任何策略字段。
# 节拍规则：period_s 必须为 space.timestep_s 的整数倍（900 = 3 × 300），
#           取值范围 60–3600 s；缺省（不写 control 段）= 每个物理步决策。
# 校验：vfed validate examples/example_control.yaml
# 运行：vfed evaluate examples/example_control.yaml --cache weather_cache
# 文档：docs/architecture.md · 契约见 vfed/design/project.py（ControlConfig）
#       策略协议见 vfed/design/control.py（BuildingPolicy: reset/plan_daily/step）
name: example_control
# 站点与气象（与 examples/example_sweep.yaml 相同；weather_cache/ 已缓存该格点）
site:
  lat: 30.9
  lon: 121.5
  tz_hours: 8.0
  tilt: 20.0
  azimuth: 180.0
  year: 2023
# 建筑围护结构（第一性原理 ODE 热工模型）
envelope:
  U_wall_A: 125.3
  A_window: 0.0
  eta_solar: 0.15
  ach: 0.001   # 密闭植物工厂气密换气率（Kozai 2013: 0.01-0.02；0.1 为保守泄漏上限）
  permeance: 0.0
  V_room: 200.0
  rho_air: 1.2
  cp_air: 1005.0
  C_z: 200000.0
# 空调系统（cop_mode: constant 恒 COP；可选 carnot/constant/linear/table）
hvac:
  P_rated_w: 3000.0
  cop_value: 4.0
  cop_mode: constant
  cop_k: 0.02
  cop_T_ref: 25.0
  cop_heat: 3.0
  heat_mode: heat_pump
  P_rated_heat_w: 3000.0
  deadband_c: 1.0
  min_on_s: 180.0
  min_off_s: 180.0
  fan_power_w: 70.0
  shr_BF: 0.15
  tau_q: 90.0
  tau_m: 60.0
# 除湿机（P_ref_w 额定功率；poly_e 为功率多项式系数）
deh:
  P_ref_w: 2233.0
  poly_e:
  - 1.0
  - 0.02
  - 0.0
  - 0.05
  - 0.0
  - 0.0
  T_mean: 22.0
  T_std: 5.0
  W_mean: 0.012
  W_std: 0.003
  smer: 2.0
  deadband_rh: 3.0
  min_on_s: 180.0
  min_off_s: 180.0
  fan_power_w: 40.0
  tau_q: 90.0
  tau_m: 120.0
# LED 照明（auto_deduce=true 时按 ppfd_target×covered_area/efficacy 重算功率）
led:
  power_w: 1300.0  # 被 auto_deduce 覆盖：实际重算为 ppfd_target×covered_area/efficacy
  light_start_hour: 6
  photoperiod_hours: 16
  heat_fraction: 1.0
  auto_deduce: true  # true → power_w 忽略，功率=ppfd_target×covered_area/efficacy
  efficacy: 2.5
  ppfd_target: 400.0
  covered_area: 45.0
# 蒸腾模型（method: van_henten 生长耦合）
transpiration:
  method: van_henten
  stage_factor: 1.0
# 温湿度/CO2 设定点（光期/暗期分设温度）
setpoints:
  T_light: 22.0
  T_dark: 18.0
  RH: 65.0
  co2_ppm: 800.0
  crop_cycle_days: 30.0
# 电价（legacy 三费率；可用 hourly_prices 替代）
tariff:
  peak_price: 0.096
  normal_price: 0.096
  valley_price: 0.096
  export_price: 0.05
  peak_hours:
  - 10
  - 11
  - 12
  - 13
  - 14
  - 18
  - 19
  - 20
  - 21
  valley_hours:
  - 0
  - 1
  - 2
  - 3
  - 4
  - 5
  - 23
# 设计空间（timestep_s=300：控制节拍 900 s = 3 个物理子步）
space:
  parameter_ranges: {}
  timestep_s: 300.0
  objective: lcoe
equipment_power_w: 0.0  # 其他设备恒定基础电耗（W）
# ── 控制节拍（T2 契约）──────────────────────────────────────────────────
# period_s: 策略每 k 个物理子步决策一次（k = period_s / timestep_s = 900/300 = 3）。
# 不写本段（或写 period_s: null）= 每个物理步决策，行为与旧版逐位一致。
# 策略挂载入口（Python 侧，YAML 不携带）：
#   from vfed.design.control import build_policy
#   policy = build_policy({"type": "setpoint_offset", "params": {...}})
#   DesignEngine(...).run(project, policy=policy)
control:
  period_s: 900
