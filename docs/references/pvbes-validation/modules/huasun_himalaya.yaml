    42.32 V x 17.26 A = 730.4 W; 730 W / 3.1059 m2 active area = 23.50 %
    eta. Bifaciality 90 +/-5 %. NOCT 44 +/-2 C (datasheet; NOT the legacy
    modeling default 45). Temperature coefficients: gamma_Pmax -0.24 %/C,
    beta_Voc -0.22 %/C, alpha_Isc +0.04 %/C. BNPI row 818 W @ 135 W/m2
    confirms ~90 % bifacial gain. Full seven-tier table in
    context_from_source below. This is the HSN-210 neighbor tier of the
    Himalaya 212 series (same B132 platform, 132 half-cells 6x22,
    2384x1303x33 mm, 36.5 kg, 2.0 mm dual glass, DC 1500 V); preset name
    stays "huasun_himalaya" (series-level name). area_to_power =
    3.1068/0.730 = 4.256 m2/kWp. NOCT condition row DS730: 557 W, 40.41 V,
    13.79 A, 48.08 V, 14.67 A.
